version: 2
project_name: synr

builds:
  - main: ./cmd/synr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz

checksum:
  algorithm: sha256

changelog:
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
